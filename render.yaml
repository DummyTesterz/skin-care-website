services:
  - type: web
    name: lilly-skin-care
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn lilly_store.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: LILLY_ADMIN_EMAIL
        sync: false
      - key: LILLY_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lilly-skin-care-db
          property: connectionString

databases:
  - name: lilly-skin-care-db
    plan: free
